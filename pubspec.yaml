name: otel_workmanager
description: >-
  OpenTelemetry instrumentation for workmanager by Dartastic.io. Adds standard
  OpenTelemetry observability to applications that use workmanager.
version: 0.2.1
repository: https://github.com/dartastic/otel_workmanager
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  dartastic_opentelemetry_api: '>=1.0.0-rc.4 <1.0.0-rc.5'
  flutter:
    sdk: flutter
  workmanager: ">=0.6.0 <0.11.0"

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  dartastic_opentelemetry: ^1.1.0-beta.17
  flutter_test:
    sdk: flutter
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
